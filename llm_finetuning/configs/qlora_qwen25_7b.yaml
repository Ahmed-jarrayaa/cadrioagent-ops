# Configuration principale — QLoRA 4-bit Qwen2.5-7B-Instruct (Google Colab T4/L4).
# Les chemins sont relatifs à la racine du dépôt.

model:
  name: Qwen/Qwen2.5-7B-Instruct
  revision: main
  trust_remote_code: false
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: float16
  max_seq_length: 2048
  dtype: float16          # T4 (Colab gratuit) ne supporte pas bfloat16 ; passer à bfloat16 sur L4/A100

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_gradient_checkpointing: unsloth

training:
  output_dir: llm_finetuning/outputs/qwen25-7b-cardio
  num_train_epochs: 2
  max_steps: -1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  optim: paged_adamw_8bit
  logging_steps: 5
  eval_strategy: steps
  eval_steps: 20
  save_strategy: steps
  save_steps: 20
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  bf16: false
  fp16: true
  gradient_checkpointing: true
  seed: 42
  report_to: []
  dataloader_num_workers: 2

data:
  train: llm_finetuning/data/dataset/train.jsonl
  validation: llm_finetuning/data/dataset/validation.jsonl
  test: llm_finetuning/data/dataset/test.jsonl

mlflow:
  experiment: cardioagent_llm
  tracking_uri: null      # null = serveur local http://localhost:5000, sinon repli SQLite
  run_name: qlora_qwen25_7b_cardio
