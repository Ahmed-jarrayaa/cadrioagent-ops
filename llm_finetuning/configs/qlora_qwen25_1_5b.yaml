# Configuration de repli — Qwen2.5-1.5B-Instruct.
# Utile pour les tests de bout en bout sur Colab, ou un smoke test local si le disque le permet.
# Elle ne remplace pas la configuration 7B attendue pour la version finale.

model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  revision: main
  trust_remote_code: false
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: float16
  max_seq_length: 1024
  dtype: float16

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_gradient_checkpointing: unsloth

training:
  output_dir: llm_finetuning/outputs/qwen25-1.5b-cardio
  num_train_epochs: 1
  max_steps: -1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  optim: paged_adamw_8bit
  logging_steps: 5
  eval_strategy: steps
  eval_steps: 20
  save_strategy: steps
  save_steps: 20
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  bf16: false
  fp16: true
  gradient_checkpointing: true
  seed: 42
  report_to: []
  dataloader_num_workers: 2

data:
  train: llm_finetuning/data/dataset/train.jsonl
  validation: llm_finetuning/data/dataset/validation.jsonl
  test: llm_finetuning/data/dataset/test.jsonl

mlflow:
  experiment: cardioagent_llm
  tracking_uri: null
  run_name: qlora_qwen25_1_5b_cardio
