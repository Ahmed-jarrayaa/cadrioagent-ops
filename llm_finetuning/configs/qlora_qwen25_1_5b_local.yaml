# Configuration locale — Qwen2.5-1.5B-Instruct sur GPU 4 Go (RTX 2050 Laptop).
# Objectif : entraînement réellement exécutable en local, sans Unsloth (Windows natif),
# avec Transformers + PEFT + TRL + bitsandbytes.
#
# Mémoire : le dataset est court (max ~583 caractères), d'où max_seq_length réduit à 512.
# L'évaluation n'a lieu qu'une fois par époque (112 pas au total) pour limiter les pics VRAM.

model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  revision: main
  trust_remote_code: false
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: float16
  max_seq_length: 512
  dtype: float16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_gradient_checkpointing: true

training:
  output_dir: llm_finetuning/outputs/qwen25-1.5b-local
  num_train_epochs: 2
  max_steps: -1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  optim: paged_adamw_8bit
  logging_steps: 5
  eval_strategy: steps
  eval_steps: 50
  save_strategy: steps
  save_steps: 50
  save_total_limit: 1
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  bf16: false
  fp16: true
  gradient_checkpointing: true
  seed: 42
  report_to: []
  dataloader_num_workers: 0

data:
  train: llm_finetuning/data/dataset/train.jsonl
  validation: llm_finetuning/data/dataset/validation.jsonl
  test: llm_finetuning/data/dataset/test.jsonl

mlflow:
  experiment: cardioagent_llm
  tracking_uri: null
  run_name: qlora_qwen25_1_5b_local
