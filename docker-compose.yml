name: cardioagent-ops

services:
  llm-server:
    build: ./docker/llm-server
    container_name: llm-server
    restart: unless-stopped
    ports: ["11434:11434"]
    volumes:
      - ollama_data:/root/.ollama
      - ./llm_finetuning/export:/models:ro
    networks: [docker-network]
    # Retire ce bloc si tu n'as pas de GPU NVIDIA
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  vector-db:
    build: ./docker/vector-db
    container_name: vector-db
    restart: unless-stopped
    ports: ["6333:6333"]
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [docker-network]

  mlflow-server:
    build: ./docker/mlflow-server
    container_name: mlflow-server
    restart: unless-stopped
    ports: ["5000:5000"]
    volumes:
      - mlflow_data:/mlflow
    networks: [docker-network]

  audio-engine:
    build:
      context: .
      dockerfile: docker/audio-engine/Dockerfile
    container_name: audio-engine
    restart: unless-stopped
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      MODEL_PATH: /app/models/cardio_model.onnx
    # Pas de publication de port : en Docker, l'interface passe par l'api-gateway (8085),
    # qui proxifie /predict_all, /predict_one et /models vers ce conteneur.
    # Le port 8001 reste réservé au lancement local (uvicorn) décrit dans le Readme.
    volumes:
      - ./audio_engine/models:/app/models:ro
      # Décommente seulement si tu entraînes dans le conteneur :
      # - ./ourdataset:/dataset:ro
    depends_on: [mlflow-server]
    networks: [docker-network]

  agent-orchestrator:
    build:
      context: .
      dockerfile: docker/agent-orchestrator/Dockerfile
    container_name: agent-orchestrator
    restart: unless-stopped
    environment:
      LLM_URL: http://llm-server:11434
      LLM_MODEL: cardio-llm
      QDRANT_URL: http://vector-db:6333
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
    depends_on: [llm-server, vector-db, mlflow-server]
    networks: [docker-network]

  api-gateway:
    build:
      context: .
      dockerfile: docker/api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    environment:
      AUDIO_ENGINE_URL: http://audio-engine:8001
      ORCHESTRATOR_URL: http://agent-orchestrator:8002
    ports: ["8085:8000"]
    depends_on: [audio-engine, agent-orchestrator]
    networks: [docker-network]

networks:
  docker-network:
    driver: bridge

volumes:
  ollama_data:
  qdrant_data:
  mlflow_data: